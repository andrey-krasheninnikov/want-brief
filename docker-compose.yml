services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wantbrief
      POSTGRES_PASSWORD: wantbrief
      POSTGRES_DB: wantbrief
    ports:
      - "5432:5432"
    volumes:
      - wantbrief_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wantbrief -d wantbrief"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  wantbrief_pg:
